  position: relative;
}

.sticky{
  position: sticky;
}

.block{
  display: block;
}

.inline-block{
  display: inline-block;
}

.flex{
  display: flex;
}

.table{
  display: table;
}

.grid{
  display: grid;
}

.contents{
  display: contents;
}

.hidden{
  display: none;
}

.border{
  border-width: 1px;
}

.capitalize{
  text-transform: capitalize;
}

.filter{
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

:root{
  --bg:#f6f2e9;
  --surface:#fffdf7;
  --surface2:#efe9da;
  --ink:#17211a;
  --muted:#6b7168;
  --line:#ddd5c2;
  --primary:#16683f;
  --primary2:#0d4a2d;
  --accent:#e9a426;
  --danger:#b42318;
  --ok:#16794b;
  --card-shadow:0 10px 30px rgba(23,33,26,.07);
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#101714;
    --surface:#18211b;
    --surface2:#223026;
    --ink:#f2efe6;
    --muted:#a9b2a6;
    --line:#33443a;
    --primary:#4cc07f;
    --primary2:#7ed6a3;
    --accent:#f2b63a;
    --danger:#ff8a7d;
    --ok:#6fd8a0;
    --card-shadow:0 10px 30px rgba(0,0,0,.25);
  }
}

[data-theme="dark"]{
  --bg:#101714;
  --surface:#18211b;
  --surface2:#223026;
  --ink:#f2efe6;
  --muted:#a9b2a6;
  --line:#33443a;
  --primary:#4cc07f;
  --primary2:#7ed6a3;
  --accent:#f2b63a;
  --danger:#ff8a7d;
  --ok:#6fd8a0;
  --card-shadow:0 10px 30px rgba(0,0,0,.25);
}

[data-theme="light"]{
  --bg:#f6f2e9;
  --surface:#fffdf7;
  --surface2:#efe9da;
  --ink:#17211a;
  --muted:#6b7168;
  --line:#ddd5c2;
  --primary:#16683f;
  --primary2:#0d4a2d;
  --accent:#e9a426;
  --danger:#b42318;
  --ok:#16794b;
  --card-shadow:0 10px 30px rgba(23,33,26,.07);
}

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"Public Sans",system-ui,sans-serif
}

.font-display{
  font-family:"Fraunces",Georgia,serif
}

button,input,select,textarea{
  font:inherit
}

button{
  cursor:pointer
}

input,select,textarea{
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--ink);
  border-radius:10px;
  padding:10px 12px;
  width:100%;
  outline:none
}

input:focus,select:focus,textarea:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent)
}

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:16px;
  box-shadow:var(--card-shadow)
}

.small{
  font-size:13px;
  color:var(--muted)
}

.btn-primary{
  background:var(--primary);
  color:#fff;
  border:0;
  border-radius:10px;
  padding:10px 14px;
  font-weight:700
}

.btn-ghost{
  background:transparent;
  border:1px solid var(--line);
  border-radius:10px;
  padding:9px 12px;
  color:var(--ink);
  font-weight:600
}

.btn-dark{
  background:var(--ink);
  color:var(--bg);
  border:0;
  border-radius:10px;
  padding:10px 14px;
  font-weight:700
}

.chip{
  display:inline-flex;
  align-items:center;
  gap:5px;
  border:1px solid var(--line);
  border-radius:999px;
  padding:4px 8px;
  font-size:12px;
  font-weight:700;
  background:var(--surface2)
}

.nav-btn{
  width:100%;
  text-align:left;
  border:0;
  background:transparent;
  color:var(--ink);
  padding:11px 12px;
  border-radius:11px;
  display:flex;
  gap:10px;
  align-items:center;
  font-weight:600
}

.nav-btn.active{
  background:var(--primary);
  color:white
}

.table-wrap{
  overflow:auto;
  border:1px solid var(--line);
  border-radius:12px
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:640px
}

th{
  text-align:left;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.06em;
  color:var(--muted);
  padding:12px;
  border-bottom:1px solid var(--line)
}

td{
  padding:12px;
  border-bottom:1px solid var(--line);
  vertical-align:top
}

tr:last-child td{
  border-bottom:0
}

.kpi-num{
  font-size:clamp(30px,4vw,44px);
  line-height:1;
  font-family:"Fraunces",Georgia,serif;
  font-weight:700
}

::-webkit-scrollbar{
  height:8px;
  width:8px
}

::-webkit-scrollbar-thumb{
  background:var(--line);
  border-radius:99px
}

@media(max-width:760px){
  .hide-m{
    display:none
  }
}
